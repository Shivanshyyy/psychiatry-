<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Psychiatry+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { navy: { DEFAULT: '#041021' }, teal: { DEFAULT: '#009fa5', hover: '#008388' } } } }
        }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <!-- Simple Header -->
    <header class="w-full bg-navy p-6 flex justify-center">
        <a href="index.html" class="text-2xl font-bold tracking-tight text-white">Psychiatry<span class="text-teal">+</span></a>
    </header>

    <!-- Login Form -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl border border-gray-100">
            <h2 class="text-2xl font-bold text-navy mb-2 text-center">Welcome back</h2>
            <p class="text-gray-500 text-center mb-8">Please enter your details to sign in.</p>

            <form action="index.html" method="GET">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal focus:border-teal outline-none transition-all" placeholder="doctor@hospital.com">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal focus:border-teal outline-none transition-all" placeholder="••••••••">
                    <div class="flex justify-end mt-2">
                        <a href="#" class="text-sm text-teal hover:underline">Forgot password?</a>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-teal hover:bg-teal-hover text-white font-bold py-3 rounded-lg transition-colors shadow-md">
                    Sign In
                </button>
            </form>

            <p class="text-center text-gray-600 mt-6 text-sm">
                Don't have an account? <a href="signup.html" class="text-teal font-bold hover:underline">Sign up</a>
            </p>
        </div>
    </main>
</body>
</html>
