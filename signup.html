<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join | Psychiatry+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { navy: { DEFAULT: '#041021' }, teal: { DEFAULT: '#009fa5', hover: '#008388' }, orange: { DEFAULT: '#ff784f' } } } }
        }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <!-- Simple Header -->
    <header class="w-full bg-navy p-6 flex justify-center">
        <a href="index.html" class="text-2xl font-bold tracking-tight text-white">Psychiatry<span class="text-teal">+</span></a>
    </header>

    <!-- Sign Up Form -->
    <main class="flex-grow flex items-center justify-center p-6 py-12">
        <div class="bg-white w-full max-w-lg p-8 rounded-2xl shadow-xl border border-gray-100">
            <h2 class="text-2xl font-bold text-navy mb-2 text-center">Create your account</h2>
            <p class="text-gray-500 text-center mb-8">Join thousands of clinical professionals today.</p>

            <form action="index.html" method="GET">
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                        <input type="text" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                        <input type="text" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal outline-none">
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal outline-none">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal outline-none">
                </div>

                <!-- Plan Selection -->
                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-3">Select Plan</label>
                    <div class="space-y-3">
                        <label class="flex items-center p-4 border-2 border-teal bg-teal/5 rounded-lg cursor-pointer">
                            <input type="radio" name="plan" value="annual" checked class="text-teal focus:ring-teal w-5 h-5">
                            <div class="ml-3 flex-grow">
                                <span class="block font-bold text-navy">Annual Plan (Save 50%)</span>
                                <span class="block text-sm text-gray-500">$149.95 / year</span>
                            </div>
                        </label>
                        <label class="flex items-center p-4 border border-gray-200 hover:bg-gray-50 rounded-lg cursor-pointer">
                            <input type="radio" name="plan" value="monthly" class="text-teal focus:ring-teal w-5 h-5">
                            <div class="ml-3 flex-grow">
                                <span class="block font-bold text-navy">Monthly Plan</span>
                                <span class="block text-sm text-gray-500">$24.99 / month</span>
                            </div>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-teal hover:bg-teal-hover text-white font-bold py-3.5 rounded-lg transition-colors shadow-md text-lg">
                    Complete Registration
                </button>
            </form>

            <p class="text-center text-gray-600 mt-6 text-sm">
                Already have an account? <a href="login.html" class="text-teal font-bold hover:underline">Sign in</a>
            </p>
        </div>
    </main>
</body>
</html>
